services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OHS_APP_PASSWORD: ${OHS_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Рабочее подключение: роль БЕЗ права обходить RLS
      DATABASE_URL: postgresql+psycopg://ohs_app:${OHS_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      # Подключение владельца: только для миграций
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app:z
      - ./storage:/app/storage:z
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Графический интерфейс для просмотра и редактирования БД: http://localhost:8080
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_USER: ${POSTGRES_USER}
      ADMINER_DEFAULT_DB: ${POSTGRES_DB}
    volumes:
      # своя тема (тёмно-синяя), русские подписи и вход с заполненными полями
      - ./deploy/adminer/index.php:/var/www/html/index.php:ro,z
      - ./deploy/adminer/adminer.css:/var/www/html/adminer.css:ro,z
      - ./deploy/adminer/ohs-plugin.php:/var/www/html/plugins-enabled/900-ohs.php:ro,z
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
